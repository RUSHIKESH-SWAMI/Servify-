services:

  # --- Databases ---

  accounts-db:
    image: postgres:16
    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234r
    volumes:
      - accounts_db_data:/var/lib/postgresql/data

  services-db:
    image: postgres:16
    environment:
      POSTGRES_DB: services_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234r
    volumes:
      - services_db_data:/var/lib/postgresql/data

  bookings-db:
    image: postgres:16
    environment:
      POSTGRES_DB: bookings_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234r
    volumes:
      - bookings_db_data:/var/lib/postgresql/data

  # --- Django Services ---

  servify-accounts:
    build: ./servify-accounts
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    volumes:
      - ./servify-accounts:/app
    depends_on:
      - accounts-db

  servify-services:
    build: ./servify-services
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8002"
    volumes:
      - ./servify-services:/app
    depends_on:
      - services-db

  servify-bookings:
    build: ./servify-bookings
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8003"
    volumes:
      - ./servify-bookings:/app
    depends_on:
      - bookings-db
      - servify-accounts

  # --- API Gateway ---

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - servify-accounts
      - servify-services
      - servify-bookings

volumes:
  accounts_db_data:
  services_db_data:
  bookings_db_data:
